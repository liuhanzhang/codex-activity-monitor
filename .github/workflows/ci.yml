name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Python package
        run: |
          python -m venv .local/venv
          .local/venv/bin/python -m pip install -e .
      - name: Check generated localization resources
        run: .local/venv/bin/python bin/export-localizations --check
      - name: Test Python
        run: .local/venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Test Swift
        run: swift test --package-path macos
      - name: Build preview app bundle
        run: bin/build-gui --preview
      - name: Check whitespace and generated changes
        run: |
          git diff --check
          git diff --exit-code
