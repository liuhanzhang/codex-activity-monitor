[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-activity-monitor"
version = "0.1.0"
description = "Local live activity and received-token feedback for Codex Desktop"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["tiktoken==0.14.0", "rich==15.0.0"]

[project.scripts]
codex-activity-monitor = "codex_activity_monitor.cli:main"

[tool.codex-activity-monitor]
version-suffix = "alpha.4"
release-prerelease = true
build-number = 4
sparkle-public-key = "KyP+O/onQT86cTG0qCxPqNMdX1ZH0GT0DXNPm4APC+c="
update-feed-base = "https://liuhanzhang.github.io/codex-activity-monitor/updates/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codex_activity_monitor*"]
